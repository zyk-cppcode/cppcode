<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        .login-box {
            width: 320px;
            padding: 40px 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000012;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            background: #667eea;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #5a6edb;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>账号登录</h2>
        <input type="text" placeholder="用户名">
        <input type="password" placeholder="密码">
        <button>立即登录</button>
    </div>
</body>
</html>
